name: Android TV build

# Builds the OTT-X TV payload, verifies it, then compiles the APK (and a signed
# AAB/APK when the keystore secrets are configured).
#
# The shared web frontend is pulled from the LG/webOS project at build time
# (see docs/ci.md) — this repository never vendors a copy of it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: "OTT-X frontend ref (branch, tag or commit)"
        required: false
        default: main

permissions:
  contents: read

env:
  FRONTEND_REPO: coolwormgit/ott-x
  # workflow_dispatch may override; every other event falls back to main.
  FRONTEND_REF: ${{ github.event.inputs.frontend_ref || 'main' }}

jobs:
  apk:
    name: Web payload + APK
    runs-on: ubuntu-latest
    env:
      # Job-level so the `if:` conditions below can test it; empty on fork PRs.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      OTT_SRC: ${{ github.workspace }}/_shared/OTT-X

    steps:
      - name: Checkout this project
        uses: actions/checkout@v4

      - name: Check frontend access token
        env:
          FRONTEND_TOKEN: ${{ secrets.FRONTEND_TOKEN }}
        run: |
          if [ -z "$FRONTEND_TOKEN" ]; then
            echo "::error::FRONTEND_TOKEN is not set, and $FRONTEND_REPO is private, so the frontend cannot be checked out."
            echo "Create a fine-grained PAT with 'Contents: Read' on $FRONTEND_REPO and add it as the repository secret FRONTEND_TOKEN (docs/ci.md)."
            exit 1
          fi

      - name: Checkout the shared OTT-X frontend (${{ env.FRONTEND_REPO }}@${{ env.FRONTEND_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_REF }}
          path: _shared/OTT-X
          # Read access to the (private) frontend repo.
          token: ${{ secrets.FRONTEND_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # The payload compiles the shared sources, which import @capacitor/core etc.
      # Those come from the frontend's own dependencies, not from this project.
      - name: Install frontend dependencies (type resolution)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: _shared/OTT-X


      - name: Build the web payload (www/)
        run: npm run web:build

      - name: Verify payload, TV manifest and separation from OTT-X
        run: npm run verify

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already ships the Android SDK, and installing the
      # legacy `tools` package (what android-actions/setup-android@v3 does) now
      # fails because Google removed it from the repository. Use the preinstalled
      # SDK and add only the packages this build needs.
      - name: Set up Android SDK and packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::no Android SDK at $SDK — set ANDROID_HOME or install one"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(command -v sdkmanager || ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMGR (SDK $SDK)"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Copy the payload into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ott-x-tv-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "Keystore decoded ($(wc -c < "$RUNNER_TEMP/release.keystore") bytes)"

      - name: Assemble signed release APK + AAB
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Upload signed release artifacts
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ott-x-tv-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
