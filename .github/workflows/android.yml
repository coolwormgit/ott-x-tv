name: Android TV build

# Builds the OTT-X TV payload, verifies it, then compiles the APK (and a signed
# AAB/APK when the keystore secrets are configured).
#
# The shared web frontend is pulled from the LG/webOS project at build time
# (see docs/ci.md) — this repository never vendors a copy of it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: "OTT-X frontend ref (branch, tag or commit)"
        required: false
        default: main

permissions:
  contents: read

env:
  FRONTEND_REPO: coolwormgit/ott-x
  # workflow_dispatch may override; every other event falls back to main.
  FRONTEND_REF: ${{ github.event.inputs.frontend_ref || 'main' }}

jobs:
  apk:
    name: Web payload + APK
    runs-on: ubuntu-latest
    env:
      # Job-level so the `if:` conditions below can test it; empty on fork PRs.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      OTT_SRC: ${{ github.workspace }}/_shared/OTT-X

    steps:
      - name: Checkout this project
        uses: actions/checkout@v4

      - name: Checkout the shared OTT-X frontend (${{ env.FRONTEND_REPO }}@${{ env.FRONTEND_REF }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_REF }}
          path: _shared/OTT-X
          # FRONTEND_TOKEN is only needed when the frontend repo is private
          # (a fine-grained PAT with read access to it).

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci


      - name: Build the web payload (www/)
        run: npm run web:build

      - name: Verify payload, TV manifest and separation from OTT-X
        run: npm run verify

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Copy the payload into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ott-x-tv-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "Keystore decoded ($(wc -c < "$RUNNER_TEMP/release.keystore") bytes)"

      - name: Assemble signed release APK + AAB
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Upload signed release artifacts
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: ott-x-tv-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
