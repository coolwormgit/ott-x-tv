// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // The app module has Kotlin sources (its native plugins), so the Kotlin
    // Gradle plugin belongs on the buildscript classpath. Declared here rather
    // than in variables.gradle on purpose: buildscript is evaluated first, so an
    // ext property defined there would not exist yet.
    ext.kotlinVersion = '2.2.0'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
